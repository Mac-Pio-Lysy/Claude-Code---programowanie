<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz o Parze Młodej — Ceremonia Patrycji i Piotra</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    :root {
      --blue: #1a56db; --blue-dark: #1040b0; --blue-mid: #2563eb; --blue-pale: #e8f1fd;
      --white: #ffffff; --bg: #eef4ff; --text: #1a2744; --text-soft: #4a5d80;
      --border: #c5d8f6; --shadow: rgba(26,86,219,0.14); --green: #16a34a; --red: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, #dbe7ff 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, #d6e4ff 0%, transparent 45%),
        var(--bg);
      min-height: 100vh; color: var(--text); padding-bottom: 60px;
    }
    header {
      background: linear-gradient(150deg, var(--blue-dark) 0%, var(--blue) 55%, var(--blue-mid) 100%);
      color: #fff; text-align: center; padding: 38px 20px 30px;
      border-radius: 0 0 26px 26px; box-shadow: 0 8px 30px var(--shadow);
    }
    header .h-icon { font-size: 2.6rem; }
    header h1 { font-size: 1.6rem; font-weight: 700; margin-top: 6px; font-family: 'Georgia', serif; }
    header p { opacity: 0.9; margin-top: 8px; font-size: 0.92rem; line-height: 1.5; }

    .container { max-width: 600px; margin: 0 auto; padding: 22px 14px 0; }

    .guest-nav { max-width: 600px; margin: 20px auto 0; display: flex; gap: 10px;
      justify-content: center; flex-wrap: wrap; padding: 0 14px; }
    .guest-nav.bottom { margin: 30px auto 10px; }
    .guest-nav a {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      font-size: 0.88rem; font-weight: 600; color: var(--blue-dark);
      background: var(--white); border: 1.5px solid var(--blue); border-radius: 24px;
      padding: 10px 18px; box-shadow: 0 2px 8px rgba(26,86,219,0.12);
      transition: background 0.18s, color 0.18s, transform 0.15s;
    }
    .guest-nav a:hover { background: var(--blue); color: #fff; transform: translateY(-1px); }

    .card {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 18px;
      padding: 24px; box-shadow: 0 4px 20px var(--shadow); margin-bottom: 26px;
    }
    .card h2 { font-size: 1.15rem; color: var(--blue-dark); margin-bottom: 6px; font-family: 'Georgia', serif; }
    .card .c-sub { font-size: 0.86rem; color: var(--text-soft); margin-bottom: 18px; line-height: 1.5; }

    label.fld-label { display: block; font-size: 0.74rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text); margin-bottom: 6px; }
    .fld {
      width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font-size: 0.98rem; font-family: inherit; color: var(--text); background: var(--white); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fld:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,86,219,0.12); }
    .fld.field-error { border-color: var(--red); }

    .btn-primary {
      width: 100%; padding: 16px; border: none; border-radius: 14px; cursor: pointer; margin-top: 20px;
      background: linear-gradient(135deg, var(--blue-dark), var(--blue)); color: #fff;
      font-size: 1.05rem; font-weight: 700; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(26,86,219,0.35); }
    .btn-primary:disabled { opacity: 0.6; cursor: default; }

    /* Postęp */
    .progress-wrap { margin-bottom: 16px; }
    .progress-label { font-size: 0.8rem; color: var(--text-soft); margin-bottom: 6px; font-weight: 600; }
    .progress-bar { height: 8px; background: var(--blue-pale); border-radius: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue-dark), var(--blue)); transition: width 0.3s; }

    .q-text { font-size: 1.2rem; font-weight: 700; color: var(--text); margin: 8px 0 18px; line-height: 1.4; font-family: 'Georgia', serif; }

    .answer {
      display: block; width: 100%; text-align: left; margin-bottom: 12px;
      padding: 15px 18px; border: 1.5px solid var(--border); border-radius: 14px;
      background: var(--white); color: var(--text); font-size: 1rem; font-family: inherit;
      cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .answer:hover { border-color: var(--blue); background: var(--blue-pale); transform: translateY(-1px); }
    .answer:active { transform: scale(0.99); }

    /* Wynik */
    .result-icon { font-size: 3.2rem; text-align: center; }
    .result-score { font-size: 2.4rem; font-weight: 800; color: var(--blue-dark); text-align: center; margin-top: 6px; font-family: 'Georgia', serif; }
    .result-sub { text-align: center; color: var(--text-soft); margin-top: 6px; font-size: 0.95rem; }
    .result-rank {
      margin: 18px auto 0; max-width: 280px; text-align: center; background: var(--blue-pale);
      border-radius: 14px; padding: 14px; color: var(--blue-dark); font-weight: 700; font-size: 1.05rem;
    }

    .state-msg { text-align: center; color: var(--text-soft); padding: 30px 10px; font-size: 0.95rem; line-height: 1.6; }
    .state-msg .sm-icon { font-size: 2.6rem; display: block; margin-bottom: 10px; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120%);
      background: var(--text); color: #fff; padding: 12px 22px; border-radius: 30px;
      font-size: 0.88rem; box-shadow: 0 6px 24px rgba(0,0,0,0.25); transition: transform 0.3s; z-index: 9999;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.err { background: var(--red); }

    @media (max-width: 480px) { .card { padding: 18px; } header h1 { font-size: 1.4rem; } }
  </style>
</head>
<body>
  <header>
    <div class="h-icon">🧠</div>
    <h1>Quiz o Parze Młodej</h1>
    <p id="quizIntro">Ceremonia Patrycji i Piotra • Jak dobrze znacie Parę Młodą? 💙</p>
  </header>

  <nav class="guest-nav">
    <a href="harmonogram.html">📅 Harmonogram</a>
    <a href="rsvp.html">✅ Potwierdź obecność</a>
    <a href="ksiega.html">💝 Księga gości</a>
  </nav>

  <div class="container">
    <div id="app">
      <div class="card"><div class="state-msg"><span class="sm-icon">⏳</span>Ładowanie quizu…</div></div>
    </div>
  </div>

  <nav class="guest-nav bottom">
    <a href="galeria.html">📸 Galeria</a>
    <a href="muzyka.html">🎵 Zaproponuj piosenkę</a>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    const QUIZ_RESULTS_COLLECTION = 'quizResults';
    const NAME_LS_KEY = 'wedding-quiz-name';

    let db = null;
    let questions = [];
    let active = false;
    let guestName = '';
    let current = 0;
    let answers = {};   // { questionId: selectedIndex }
    let score = 0;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show err';
      clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3000);
    }
    const app = () => document.getElementById('app');

    // ── Init ──
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      db.collection(FS_COLLECTION).doc(FS_DOC_ID).get().then(doc => {
        const data = doc.exists ? (doc.data() || {}) : {};
        const cfg = (data.appConfig) || {};
        const names = (cfg.displayNames || '').trim();
        if (names) {
          document.getElementById('quizIntro').textContent =
            (cfg.eventName || ('Ceremonia ' + names)) + ' • Jak dobrze znacie Parę Młodą? 💙';
          document.title = 'Quiz — ' + (cfg.eventName || names);
        }
        questions = Array.isArray(data.quizQuestions) ? data.quizQuestions : [];
        active = data.quizActive === true;
        renderIntro();
      }).catch(err => {
        console.error(err);
        app().innerHTML = '<div class="card"><div class="state-msg"><span class="sm-icon">😢</span>Nie udało się wczytać quizu. Odśwież stronę.</div></div>';
      });
    } catch (e) {
      console.error('Firebase init:', e);
    }

    // ── Ekran startowy ──
    function renderIntro() {
      if (!active || !questions.length) {
        app().innerHTML = '<div class="card"><div class="state-msg"><span class="sm-icon">🔒</span>' +
          'Quiz nie jest jeszcze dostępny. Zajrzyj tu trochę później!</div></div>';
        return;
      }
      let saved = '';
      try { saved = localStorage.getItem(NAME_LS_KEY) || ''; } catch (_) {}
      app().innerHTML =
        '<div class="card">' +
          '<h2>🧠 Sprawdź, jak dobrze nas znasz!</h2>' +
          '<p class="c-sub">' + questions.length + ' ' + plural(questions.length, 'pytanie', 'pytania', 'pytań') +
          '. Odpowiadaj jedno po drugim — na końcu poznasz swój wynik i miejsce w rankingu.</p>' +
          '<label class="fld-label" for="nameInput">Twoje imię</label>' +
          '<input type="text" id="nameInput" class="fld" placeholder="np. Anna" maxlength="60" value="' + esc(saved) + '">' +
          '<button class="btn-primary" id="startBtn"><span style="font-size:1.2rem">▶️</span> Rozpocznij quiz</button>' +
        '</div>';
      const nameInput = document.getElementById('nameInput');
      nameInput.addEventListener('input', () => nameInput.classList.remove('field-error'));
      document.getElementById('startBtn').addEventListener('click', () => {
        const n = (nameInput.value || '').trim();
        if (!n) { toast('Najpierw wpisz swoje imię 🙂'); nameInput.classList.add('field-error'); nameInput.focus(); return; }
        guestName = n;
        try { localStorage.setItem(NAME_LS_KEY, n); } catch (_) {}
        current = 0; answers = {}; score = 0;
        renderQuestion();
      });
    }

    function plural(n, one, few, many) {
      if (n === 1) return one;
      const m10 = n % 10, m100 = n % 100;
      if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
      return many;
    }

    // ── Pytanie ──
    function renderQuestion() {
      const q = questions[current];
      const ans = Array.isArray(q.answers) ? q.answers : [];
      const pct = Math.round((current / questions.length) * 100);
      app().innerHTML =
        '<div class="card">' +
          '<div class="progress-wrap">' +
            '<div class="progress-label">Pytanie ' + (current + 1) + ' z ' + questions.length + '</div>' +
            '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          '</div>' +
          '<div class="q-text">' + esc(q.question || '') + '</div>' +
          ans.map((a, i) => '<button class="answer" data-i="' + i + '">' + esc(a) + '</button>').join('') +
        '</div>';
      app().querySelectorAll('.answer').forEach(btn => {
        btn.addEventListener('click', () => choose(parseInt(btn.dataset.i, 10)));
      });
    }

    function choose(index) {
      const q = questions[current];
      answers['' + q.id] = index;
      if (index === q.correctIndex) score++;
      current++;
      if (current < questions.length) {
        renderQuestion();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        submitResult();
      }
    }

    // ── Zapis + wynik ──
    async function submitResult() {
      app().innerHTML = '<div class="card"><div class="state-msg"><span class="sm-icon">⏳</span>Zapisujemy Twój wynik…</div></div>';
      const total = questions.length;
      let rank = null, participants = null;
      try {
        await db.collection(QUIZ_RESULTS_COLLECTION).add({
          name: guestName, score: score, total: total,
          answers: answers, timestamp: Date.now(),
        });
        // Ranking: ilu graczy ma wyższy wynik.
        const snap = await db.collection(QUIZ_RESULTS_COLLECTION).get();
        const scores = snap.docs.map(d => (d.data().score || 0));
        participants = scores.length;
        rank = scores.filter(s => s > score).length + 1;
      } catch (e) {
        console.error('Zapis wyniku:', e);
        toast('Nie udało się zapisać wyniku, ale oto Twój rezultat.');
      }
      renderResult(total, rank, participants);
    }

    function renderResult(total, rank, participants) {
      const pct = total ? Math.round((score / total) * 100) : 0;
      let icon = '🎉', msg = 'Brawo!';
      if (pct === 100) { icon = '🏆'; msg = 'Perfekcyjnie! Znasz Parę Młodą na wylot!'; }
      else if (pct >= 70) { icon = '🎉'; msg = 'Świetny wynik!'; }
      else if (pct >= 40) { icon = '🙂'; msg = 'Nieźle!'; }
      else { icon = '💙'; msg = 'Dzięki za grę!'; }

      let rankHtml = '';
      if (rank && participants) {
        rankHtml = '<div class="result-rank">🏆 Miejsce ' + rank + ' z ' + participants + '</div>';
      }
      app().innerHTML =
        '<div class="card">' +
          '<div class="result-icon">' + icon + '</div>' +
          '<div class="result-score">' + score + ' / ' + total + '</div>' +
          '<div class="result-sub">' + esc(msg) + ' (' + pct + '% poprawnych)</div>' +
          rankHtml +
          '<button class="btn-primary" id="againBtn"><span style="font-size:1.1rem">🔄</span> Zagraj ponownie</button>' +
        '</div>';
      document.getElementById('againBtn').addEventListener('click', () => {
        current = 0; answers = {}; score = 0;
        renderIntro();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }
  </script>
</body>
</html>
