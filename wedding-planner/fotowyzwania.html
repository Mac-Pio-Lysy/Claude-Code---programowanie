<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foto-wyzwania — Ceremonia Patrycji i Piotra</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <style>
    :root {
      --blue: #1a56db; --blue-dark: #1040b0; --blue-mid: #2563eb; --blue-pale: #e8f1fd;
      --white: #ffffff; --bg: #eef4ff; --text: #1a2744; --text-soft: #4a5d80;
      --border: #c5d8f6; --shadow: rgba(26,86,219,0.14); --green: #16a34a; --red: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 0%, #dbe7ff 0%, transparent 45%),
        radial-gradient(circle at 85% 100%, #d6e4ff 0%, transparent 45%),
        var(--bg);
      min-height: 100vh; color: var(--text); padding-bottom: 60px;
    }
    header {
      background: linear-gradient(150deg, var(--blue-dark) 0%, var(--blue) 55%, var(--blue-mid) 100%);
      color: #fff; text-align: center; padding: 38px 20px 30px;
      border-radius: 0 0 26px 26px; box-shadow: 0 8px 30px var(--shadow);
    }
    header .h-icon { font-size: 2.6rem; }
    header h1 { font-size: 1.6rem; font-weight: 700; margin-top: 6px; font-family: 'Georgia', serif; }
    header p { opacity: 0.9; margin-top: 8px; font-size: 0.92rem; line-height: 1.5; }

    .container { max-width: 640px; margin: 0 auto; padding: 22px 14px 0; }

    .guest-nav { max-width: 640px; margin: 20px auto 0; display: flex; gap: 10px;
      justify-content: center; flex-wrap: wrap; padding: 0 14px; }
    .guest-nav.bottom { margin: 30px auto 10px; }
    .guest-nav a {
      display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
      font-size: 0.88rem; font-weight: 600; color: var(--blue-dark);
      background: var(--white); border: 1.5px solid var(--blue); border-radius: 24px;
      padding: 10px 18px; box-shadow: 0 2px 8px rgba(26,86,219,0.12);
      transition: background 0.18s, color 0.18s, transform 0.15s;
    }
    .guest-nav a:hover { background: var(--blue); color: #fff; transform: translateY(-1px); }

    .card {
      background: var(--white); border: 1.5px solid var(--border); border-radius: 18px;
      padding: 24px; box-shadow: 0 4px 20px var(--shadow); margin-bottom: 22px;
    }
    .card h2 { font-size: 1.12rem; color: var(--blue-dark); margin-bottom: 6px; font-family: 'Georgia', serif; }
    .card .c-sub { font-size: 0.86rem; color: var(--text-soft); margin-bottom: 18px; line-height: 1.5; }

    label.fld-label { display: block; font-size: 0.74rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; color: var(--text); margin-bottom: 6px; }
    .fld {
      width: 100%; border: 1.5px solid var(--border); border-radius: 12px; padding: 12px 14px;
      font-size: 0.98rem; font-family: inherit; color: var(--text); background: var(--white); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fld:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(26,86,219,0.12); }
    .fld.field-error { border-color: var(--red); }

    .btn-primary {
      width: 100%; padding: 16px; border: none; border-radius: 14px; cursor: pointer; margin-top: 20px;
      background: linear-gradient(135deg, var(--blue-dark), var(--blue)); color: #fff;
      font-size: 1.05rem; font-weight: 700; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: transform 0.15s, box-shadow 0.2s;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(26,86,219,0.35); }

    /* Pasek postępu */
    .progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .progress-head .ph-title { font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .progress-head .ph-count { font-size: 0.9rem; font-weight: 700; color: var(--blue-dark); }
    .progress-bar { height: 12px; background: var(--blue-pale); border-radius: 8px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--blue-dark), var(--blue)); transition: width 0.4s; }
    .progress-done { text-align: center; margin-top: 10px; font-size: 0.9rem; color: var(--green); font-weight: 700; }

    /* Wyzwanie */
    .challenge {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 12px; background: var(--white);
      transition: border-color 0.2s, background 0.2s;
    }
    .challenge.done { border-color: var(--green); background: #f3fbf6; }
    .ch-status { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center;
      justify-content: center; font-size: 1rem; flex-shrink: 0; border: 2px solid var(--border); color: var(--text-soft); }
    .challenge.done .ch-status { background: var(--green); border-color: var(--green); color: #fff; }
    .ch-body { flex: 1; min-width: 0; }
    .ch-text { font-size: 0.96rem; font-weight: 600; color: var(--text); line-height: 1.35; }
    .ch-points { font-size: 0.78rem; color: var(--blue-dark); font-weight: 700; margin-top: 2px; }
    .ch-btn {
      flex-shrink: 0; border: 1.5px solid var(--blue); background: var(--blue-pale); color: var(--blue-dark);
      border-radius: 12px; padding: 9px 12px; font-size: 0.82rem; font-weight: 700; cursor: pointer; font-family: inherit;
      transition: background 0.15s, transform 0.12s;
    }
    .ch-btn:hover { background: #dbe7ff; transform: translateY(-1px); }
    .challenge.done .ch-btn { border-color: var(--green); background: #fff; color: var(--green); }

    .state-msg { text-align: center; color: var(--text-soft); padding: 30px 10px; font-size: 0.95rem; line-height: 1.6; }
    .state-msg .sm-icon { font-size: 2.6rem; display: block; margin-bottom: 10px; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120%);
      background: var(--text); color: #fff; padding: 12px 22px; border-radius: 30px;
      font-size: 0.88rem; box-shadow: 0 6px 24px rgba(0,0,0,0.25); transition: transform 0.3s; z-index: 9999; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.ok { background: var(--green); }
    .toast.err { background: var(--red); }

    @media (max-width: 480px) { .card { padding: 18px; } header h1 { font-size: 1.4rem; } }
  </style>
</head>
<body>
  <header>
    <div class="h-icon">📷</div>
    <h1>Foto-wyzwania</h1>
    <p id="fcIntro">Ceremonia Patrycji i Piotra • Podejmij wyzwania i przesyłaj zdjęcia! 💙</p>
  </header>

  <nav class="guest-nav">
    <a href="harmonogram.html">📅 Harmonogram</a>
    <a href="galeria.html">📸 Galeria</a>
    <a href="ksiega.html">💝 Księga gości</a>
  </nav>

  <div class="container">
    <div id="app">
      <div class="card"><div class="state-msg"><span class="sm-icon">⏳</span>Ładowanie wyzwań…</div></div>
    </div>
  </div>

  <nav class="guest-nav bottom">
    <a href="rsvp.html">✅ Potwierdź obecność</a>
    <a href="muzyka.html">🎵 Zaproponuj piosenkę</a>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    const CLOUDINARY_CLOUD_NAME    = 'dybgmjmu3';
    const CLOUDINARY_UPLOAD_PRESET = 'Ceremonia_Patrycji_i_Piotra';
    const FC_COLLECTION = 'photoChallenges';
    const NAME_LS_KEY = 'wedding-fc-name';

    let db = null;
    let tasks = [];
    let active = false;
    let guestName = '';
    let done = {};       // { challengeId: true }
    let _widget = null;
    let _targetId = null;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function toast(msg, kind) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'toast show' + (kind ? ' ' + kind : '');
      clearTimeout(t._timer); t._timer = setTimeout(() => t.classList.remove('show'), 3000);
    }
    const app = () => document.getElementById('app');

    // ── Init ──
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      db.collection(FS_COLLECTION).doc(FS_DOC_ID).get().then(doc => {
        const data = doc.exists ? (doc.data() || {}) : {};
        const cfg = (data.appConfig) || {};
        const names = (cfg.displayNames || '').trim();
        if (names) {
          document.getElementById('fcIntro').textContent =
            (cfg.eventName || ('Ceremonia ' + names)) + ' • Podejmij wyzwania i przesyłaj zdjęcia! 💙';
          document.title = 'Foto-wyzwania — ' + (cfg.eventName || names);
        }
        tasks = Array.isArray(data.photoChallengeTasks) ? data.photoChallengeTasks : [];
        active = data.photoChallengesActive === true;
        renderIntro();
      }).catch(err => {
        console.error(err);
        app().innerHTML = '<div class="card"><div class="state-msg"><span class="sm-icon">😢</span>Nie udało się wczytać wyzwań. Odśwież stronę.</div></div>';
      });
    } catch (e) { console.error('Firebase init:', e); }

    function plural(n, one, few, many) {
      if (n === 1) return one;
      const m10 = n % 10, m100 = n % 100;
      if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
      return many;
    }

    // ── Ekran startowy ──
    function renderIntro() {
      if (!active || !tasks.length) {
        app().innerHTML = '<div class="card"><div class="state-msg"><span class="sm-icon">🔒</span>' +
          'Foto-wyzwania nie są jeszcze dostępne. Zajrzyj tu trochę później!</div></div>';
        return;
      }
      let saved = '';
      try { saved = localStorage.getItem(NAME_LS_KEY) || ''; } catch (_) {}
      app().innerHTML =
        '<div class="card">' +
          '<h2>📷 Podejmij wyzwania!</h2>' +
          '<p class="c-sub">' + tasks.length + ' ' +
          plural(tasks.length, 'wyzwanie', 'wyzwania', 'wyzwań') +
          ' do wykonania. Rób zdjęcia i przesyłaj je tutaj — śledź swój postęp!</p>' +
          '<label class="fld-label" for="nameInput">Twoje imię</label>' +
          '<input type="text" id="nameInput" class="fld" placeholder="np. Anna" maxlength="60" value="' + esc(saved) + '">' +
          '<button class="btn-primary" id="startBtn"><span style="font-size:1.2rem">▶️</span> Zaczynamy</button>' +
        '</div>';
      const nameInput = document.getElementById('nameInput');
      nameInput.addEventListener('input', () => nameInput.classList.remove('field-error'));
      document.getElementById('startBtn').addEventListener('click', async () => {
        const n = (nameInput.value || '').trim();
        if (!n) { toast('Najpierw wpisz swoje imię 🙂', 'err'); nameInput.classList.add('field-error'); nameInput.focus(); return; }
        guestName = n;
        try { localStorage.setItem(NAME_LS_KEY, n); } catch (_) {}
        await loadDone();
        renderChallenges();
      });
    }

    // ── Wczytaj wykonane wyzwania dla tego imienia ──
    async function loadDone() {
      done = {};
      try {
        const snap = await db.collection(FC_COLLECTION).where('name', '==', guestName).get();
        snap.docs.forEach(d => { const c = d.data().challengeId; if (c != null) done[c] = true; });
      } catch (e) { console.error('loadDone:', e); }
    }

    // ── Lista wyzwań ──
    function renderChallenges() {
      const doneCount = tasks.filter(t => done[t.id]).length;
      const pct = tasks.length ? Math.round((doneCount / tasks.length) * 100) : 0;
      const allDone = doneCount === tasks.length;
      app().innerHTML =
        '<div class="card">' +
          '<div class="progress-head"><span class="ph-title">Twój postęp</span>' +
          '<span class="ph-count">' + doneCount + ' / ' + tasks.length + '</span></div>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
          (allDone ? '<div class="progress-done">🏆 Wszystkie wyzwania wykonane! Brawo!</div>' : '') +
        '</div>' +
        '<div class="card">' +
          tasks.map(t => {
            const isDone = !!done[t.id];
            return '<div class="challenge' + (isDone ? ' done' : '') + '">' +
              '<div class="ch-status">' + (isDone ? '✓' : '○') + '</div>' +
              '<div class="ch-body">' +
                '<div class="ch-text">' + esc(t.text || '') + '</div>' +
                (t.points ? '<div class="ch-points">⭐ ' + t.points + ' pkt</div>' : '') +
              '</div>' +
              '<button class="ch-btn" data-id="' + t.id + '">' + (isDone ? '📷 Ponów' : '📷 Prześlij') + '</button>' +
            '</div>';
          }).join('') +
        '</div>';
      app().querySelectorAll('.ch-btn').forEach(btn => {
        btn.addEventListener('click', () => uploadFor(parseInt(btn.dataset.id, 10)));
      });
    }

    // ── Upload Cloudinary ──
    function getWidget() {
      if (_widget) return _widget;
      if (typeof cloudinary === 'undefined') { toast('Trwa ładowanie modułu zdjęć…', 'err'); return null; }
      _widget = cloudinary.createUploadWidget({
        cloudName: CLOUDINARY_CLOUD_NAME, uploadPreset: CLOUDINARY_UPLOAD_PRESET,
        sources: ['camera', 'local'], multiple: false, resourceType: 'image', maxFileSize: 20971520, language: 'pl',
        styles: { palette: {
          window: '#FFFFFF', windowBorder: '#c5d8f6', tabIcon: '#1a56db', menuIcons: '#1040b0',
          textDark: '#1a2744', textLight: '#FFFFFF', link: '#1a56db', action: '#1a56db',
          inactiveTabIcon: '#7a93c0', error: '#dc2626', inProgress: '#1a56db', complete: '#16a34a', sourceBg: '#eef4ff' } },
      }, onWidgetResult);
      return _widget;
    }

    function onWidgetResult(error, result) {
      if (error || !result) return;
      if (result.event === 'success') saveSubmission(result.info, _targetId);
    }

    async function saveSubmission(info, challengeId) {
      if (challengeId == null) return;
      try {
        await db.collection(FC_COLLECTION).add({
          name: guestName, challengeId: challengeId,
          photoUrl: info.secure_url, photoPublicId: info.public_id,
          timestamp: Date.now(),
        });
        done[challengeId] = true;
        renderChallenges();
        toast('Zdjęcie przesłane! ✅', 'ok');
      } catch (e) {
        console.error('Zapis zdjęcia:', e);
        toast('Nie udało się przesłać. Spróbuj ponownie.', 'err');
      }
    }

    function uploadFor(challengeId) {
      if (!db) { toast('Brak połączenia z bazą danych', 'err'); return; }
      _targetId = challengeId;
      const w = getWidget();
      if (w) w.open();
    }
  </script>
</body>
</html>
